version: 2

updates:
  # Rust is where CEMM touches the network and the user's filesystem, so its
  # dependencies get the tightest cadence.
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      tauri:
        patterns:
          - "tauri"
          - "tauri-*"

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # @typescript-eslint/parser refuses to load against TS 7.0 outright, so a
      # major bump takes lint down for the whole repo -- it is not a problem any
      # change here can fix. Drop this ignore once typescript-eslint ships TS
      # >=7.1 support: https://github.com/typescript-eslint/typescript-eslint/issues/10940
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      # The build toolchain moves as a unit; separate PRs for each transitive
      # bump would be noise nobody reads.
      build-toolchain:
        patterns:
          - "vite"
          - "vite-*"
          - "@vitejs/*"
          - "nuxt"
          - "@nuxt/*"
      linting:
        patterns:
          - "eslint"
          - "eslint-*"
          - "@eslint/*"
          - "@typescript-eslint/*"
          - "@stylistic/*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
