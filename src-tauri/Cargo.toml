[package]
name = "cemm"
version = "1.7.0"
description = "ChillEcke Modpack Manager"
authors = ["Yasir Jumaah"]
license = "MIT"
repository = "https://github.com/yasirjumaah/cemm"
edition = "2021"
rust-version = "1.88.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "cemm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "cemm"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.3", features = [] }
tauri-plugin-log = "2.8.0"
tauri-plugin-dialog = "2.7.0"
chrono = { version = "0.4.41", features = ["serde"] }
uuid = { version = "1.17.0", features = ["v4", "serde"] }
opener = "0.8.2"
tauri-plugin-opener = "2.5.3"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1.37", features = ["rt-multi-thread", "macros"] }
base64 = "0.22"
cap-fs-ext = "4.0.2"
cap-primitives = "4.0.2"
tauri-plugin-keyring = "0.1.0"
tauri-plugin-updater = "2.10.1"
tauri-plugin-process = "2.3.1"
url = "2.5"

# macOS-specific dependencies for better compatibility
[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.26.1"  # macOS native APIs

[dev-dependencies]
tempfile = "3.14"
