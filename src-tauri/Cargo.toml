[package]
name = "cemm"
version = "2.0.0"
description = "ChillEcke Modpack Manager"
authors = ["Yasir Jumaah"]
license = "MIT"
repository = "https://github.com/yasirjumaah/cemm"
edition = "2021"
rust-version = "1.88.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "cemm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "cemm"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.3", features = [] }
tauri-plugin-log = "2.8.0"
tauri-plugin-dialog = "2.7.0"
opener = "0.8.2"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1.37", features = ["rt-multi-thread", "macros"] }
base64 = "0.22"
cap-fs-ext = "4.0.2"
cap-primitives = "4.0.2"
tauri-plugin-keyring = "0.1.0"
tauri-plugin-updater = "2.10.1"
tauri-plugin-process = "2.3.1"
url = "2.5"

# Generates app/types/generated.ts from the structs below, so the TypeScript
# view of a manifest cannot drift from the Rust one. Bindings are written by
# `cargo test export_bindings`, which CI already runs.
ts-rs = "12.0"

[dev-dependencies]
tempfile = "3.14"
