name: updater passphrase recovery export

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type EXPORT_UPDATER_PASSPHRASE_RECOVERY to create the encrypted recovery capsule.
        required: true
        type: string

permissions: {}

jobs:
  export-recovery-capsule:
    runs-on: ubuntu-latest
    steps:
      - name: Require explicit confirmation
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        shell: bash
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = "EXPORT_UPDATER_PASSPHRASE_RECOVERY"

      - name: Encrypt and verify recovery capsule
        env:
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_SIGNING_RECOVERY_PASSWORD: ${{ secrets.TAURI_SIGNING_RECOVERY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077

          temp_dir="$(mktemp -d)"
          chmod 700 "$temp_dir"
          trap 'rm -rf "$temp_dir"' EXIT
          export GNUPGHOME="$temp_dir/gnupg"
          mkdir -m 700 "$GNUPGHOME"

          test -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
          test -n "$TAURI_SIGNING_RECOVERY_PASSWORD"

          plaintext="$temp_dir/updater-passphrase"
          round_trip="$temp_dir/updater-passphrase.round-trip"
          capsule="$temp_dir/updater-passphrase-recovery.gpg"
          runner_capsule="$RUNNER_TEMP/updater-passphrase-recovery.gpg"

          printf '%s' "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" > "$plaintext"

          exec 3<<<"$TAURI_SIGNING_RECOVERY_PASSWORD"
          gpg --batch --yes --quiet --no-symkey-cache --pinentry-mode loopback --passphrase-fd 3 \
            --symmetric --cipher-algo AES256 --s2k-mode 3 --s2k-digest-algo SHA512 \
            --s2k-count 65011712 --output "$capsule" "$plaintext"
          exec 3<&-

          exec 3<<<"$TAURI_SIGNING_RECOVERY_PASSWORD"
          gpg --batch --yes --quiet --no-symkey-cache --pinentry-mode loopback --passphrase-fd 3 \
            --decrypt --output "$round_trip" "$capsule"
          exec 3<&-

          cmp -s "$plaintext" "$round_trip"
          install -m 600 "$capsule" "$runner_capsule"

      - name: Upload encrypted recovery capsule
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: updater-passphrase-recovery-capsule
          path: ${{ runner.temp }}/updater-passphrase-recovery.gpg
          retention-days: 1
          if-no-files-found: error

      - name: Delete runner ciphertext
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f "$RUNNER_TEMP/updater-passphrase-recovery.gpg"
