version: 2

updates:
  # Rust is where CEMM touches the network and the user's filesystem, so its
  # dependencies get the tightest cadence.
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      tauri:
        patterns:
          - "tauri"
          - "tauri-*"

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # The build toolchain moves as a unit; separate PRs for each transitive
      # bump would be noise nobody reads.
      build-toolchain:
        patterns:
          - "vite"
          - "vite-*"
          - "@vitejs/*"
          - "nuxt"
          - "@nuxt/*"
      linting:
        patterns:
          - "eslint"
          - "eslint-*"
          - "@eslint/*"
          - "@typescript-eslint/*"
          - "@stylistic/*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
