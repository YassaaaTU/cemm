name: 'publish'
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Git tag for the release'
        required: true
        default: 'cemm-v__VERSION__'
      release_name:
        description: 'Release title'
        required: true
        default: 'CEMM v__VERSION__'
      release_body:
        description: 'Release notes'
        required: false
        default: 'Manually published CEMM release.'
      prerelease:
        description: 'Publish as a prerelease'
        required: true
        type: boolean
        default: false

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: setup bun
        uses: oven-sh/setup-bun@v1

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: install frontend dependencies
        run: bun install

      - name: install macOS x86_64 Rust target
        if: matrix.args == '--target x86_64-apple-darwin'
        run: rustup target add x86_64-apple-darwin
      
      - name: install macOS aarch64 Rust target
        if: matrix.args == '--target aarch64-apple-darwin'
        run: rustup target add aarch64-apple-darwin
      
      - name: Load version from .env
        shell: bash
        run: |
          VERSION=$(grep '^VERSION=' .env | cut -d '=' -f2)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Loaded VERSION: $VERSION"

      - uses: tauri-apps/tauri-action@v0.5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag_name }}
          releaseName: ${{ github.event_name == 'release' && github.event.release.name || inputs.release_name }}
          releaseBody: ${{ github.event_name == 'release' && github.event.release.body || inputs.release_body }}
          releaseDraft: false
          prerelease: ${{ github.event_name == 'release' && github.event.release.prerelease || inputs.prerelease }}
          args: ${{ matrix.args }} --verbose
