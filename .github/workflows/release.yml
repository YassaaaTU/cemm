name: 'publish'
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      # No defaults: nothing substitutes a placeholder here, so a default is
      # only ever a literal. `cemm-v__VERSION__` was one, and dispatching with
      # the form untouched published a release tagged exactly that.
      tag_name:
        description: 'Git tag for the release, e.g. cemm-v2.0.0'
        required: true
      release_name:
        description: 'Release title, e.g. CEMM v2.0.0'
        required: true
      release_body:
        description: 'Release notes'
        required: false
        default: 'Manually published CEMM release.'
      prerelease:
        description: 'Publish as a prerelease'
        required: true
        type: boolean
        default: false

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: setup node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: setup bun
        uses: oven-sh/setup-bun@v1

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: install frontend dependencies
        run: bun install

      - name: install macOS x86_64 Rust target
        if: matrix.args == '--target x86_64-apple-darwin'
        run: rustup target add x86_64-apple-darwin
      
      - name: install macOS aarch64 Rust target
        if: matrix.args == '--target aarch64-apple-darwin'
        run: rustup target add aarch64-apple-darwin
      
      - uses: tauri-apps/tauri-action@v0.5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag_name }}
          releaseName: ${{ github.event_name == 'release' && github.event.release.name || inputs.release_name }}
          # Same collapse risk as `prerelease` below: an empty release body would
          # silently fall through to the dispatch input.
          releaseBody: ${{ github.event_name == 'release' && github.event.release.body != '' && github.event.release.body || inputs.release_body }}
          releaseDraft: false
          # Do NOT write this as `A && B || C`. That expression collapses to C
          # whenever B is falsy, so a normal (non-prerelease) published release
          # fell through to inputs.prerelease -- which is empty on a `release`
          # event -- and tauri-action rejected "" as a non-boolean. Comparing to
          # `== true` on both sides always yields a real boolean.
          prerelease: ${{ github.event_name == 'release' && github.event.release.prerelease == true || inputs.prerelease == true }}
          args: ${{ matrix.args }} --verbose
