name: updater signing proof

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove-existing-key:
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Install signature verifier
        run: |
          sudo apt-get update
          sudo apt-get install --yes minisign

      - name: Confirm signing secrets are available
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          test -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
          echo "Both updater signing secrets are available."

      - name: Sign and verify a disposable payload
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          proof_dir="$(mktemp -d)"
          trap 'rm -rf "$proof_dir"' EXIT

          payload="$proof_dir/updater-signing-proof.txt"
          signature_file="$proof_dir/updater-signing-proof.sig"
          public_key_file="$proof_dir/updater-signing-proof.pub"

          printf 'CEMM updater signing proof\n' > "$payload"

          signature="$(bunx tauri signer sign "$payload" | tail -n 1 | tr -d '\r\n')"
          test -n "$signature"

          printf '%s' "$signature" | base64 --decode > "$signature_file"
          jq --raw-output '.plugins.updater.pubkey' src-tauri/tauri.conf.json \
            | base64 --decode > "$public_key_file"

          minisign -Vm "$payload" -x "$signature_file" -p "$public_key_file"
          echo "Existing updater key signed successfully and matches the configured public key."
